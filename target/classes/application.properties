# ===== Active Profile =====
# Tells Spring to also load application-dev.properties
spring.profiles.active=dev

# ===== Application Info =====
spring.application.name=blog-cms-backend
server.port=8080

# ===== JPA / Hibernate =====
# Automatically creates/updates tables based on your Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== JSON Serialization =====
# Ignores null fields in API responses (cleaner output)
spring.jackson.default-property-inclusion=non_null
# Formats dates as readable strings instead of timestamps
spring.jackson.serialization.write-dates-as-timestamps=false

# ===== File Upload =====
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ===== JWT Settings =====
# Change this secret in production — must be 256-bit (32+ chars)
app.jwt.secret=blogcms_super_secret_key_change_this_in_production_2024
# Token expiry: 86400000ms = 24 hours
app.jwt.expiration=86400000
# Token prefix used in Authorization header
app.jwt.prefix=Bearer 

# ===== CORS =====
app.cors.allowed-origins=http://localhost:5173

# ===== Logging =====
logging.level.com.blogcms=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG